plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Sodium is an optional, compile-only dependency used only to compile the optional
// `compat/sodium` mixins against the exact target runtime. It is never shipped in the
// release JAR and never becomes a runtime requirement; the optional mixin config and the
// reflection bridge below are guarded so that a Sodium-free environment never loads them.
// The inner (non-jarjar'd) mod JAR is extracted locally into the gitignored `libs/`
// directory from the development mod folder; see `prepareSodiumCompileLib`.
def sodium_version = '0.8.13-beta.2+mc1.21.1'
def sodium_compile_jar = file("libs/sodium-neoforge-${sodium_version}-mod.jar")

// Embeddium (铷) is the NeoForge port of Sodium, targeted by the same optional-compat architecture.
// It is also compile-only and never shipped; its JAR is placed in the gitignored `libs/` directory.
def embeddium_version = '1.0.15+mc1.21.1'
def embeddium_compile_jar = file("libs/embeddium-${embeddium_version}.jar")

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files

    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven { url = 'https://maven.enginehub.org/repo/' }
}

base {
    archivesName = mod_id.replace('_', '-')
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            systemProperty 'connector.clean.path', new File(
                    System.getProperty('user.home'),
                    '.gradle/caches/neoformruntime/artifacts/minecraft_1.21.1_client.jar').absolutePath
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('build/run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly("com.sk89q.worldedit:worldedit-core:7.3.8") {
        transitive = false
    }
    compileOnly("com.sk89q.worldedit.worldedit-libs:core:7.3.8") {
        transitive = false
    }
    // Optional Sodium compatibility: compile-time only, extracted from the local dev mod
    // directory. Not published, not a runtime dependency, guarded at runtime.
    compileOnly files(sodium_compile_jar)
    // Optional Embeddium compatibility: compile-time only, placed in the gitignored libs/ directory.
    compileOnly files(embeddium_compile_jar)
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('prepareSodiumCompileLib') {
    group = 'build setup'
    description = 'Extracts the inner Sodium mod JAR for compileOnly use (gitignored libs/).'
    outputs.file(sodium_compile_jar)
    onlyIf { !sodium_compile_jar.exists() }
    doLast {
        def outerCandidates = [
                file("run/mods/sodium-neoforge-${sodium_version}.jar"),
                file("run/mods-disabled-no-sodium/sodium-neoforge-${sodium_version}.jar"),
        ]
        def outer = outerCandidates.find { it.exists() }
        if (outer == null) {
            throw new GradleException(
                    "Sodium outer JAR not found. Expected one of: ${outerCandidates*.absolutePath.join(', ')}. " +
                            "Place sodium-neoforge-${sodium_version}.jar there, or pre-populate libs/ manually.")
        }
        def innerEntry = "META-INF/jarjar/net.caffeinemc.sodium-neoforge-${sodium_version}-mod.jar"
        sodium_compile_jar.parentFile.mkdirs()
        new java.util.zip.ZipFile(outer).withCloseable { zip ->
            def entry = zip.getEntry(innerEntry)
            if (entry == null) {
                throw new GradleException("Inner Sodium JAR entry not found: ${innerEntry}")
            }
            zip.getInputStream(entry).withCloseable { input ->
                sodium_compile_jar.withOutputStream { output -> input.transferTo(output) }
            }
        }
    }
}
tasks.named('compileJava') {
    dependsOn tasks.named('prepareSodiumCompileLib'), tasks.named('prepareEmbeddiumCompileLib')
}

tasks.register('prepareEmbeddiumCompileLib') {
    group = 'build setup'
    description = 'Locates the Embeddium mod JAR for compileOnly use (gitignored libs/).'
    outputs.file(embeddium_compile_jar)
    onlyIf { !embeddium_compile_jar.exists() }
    doLast {
        def candidates = [
                file("run/mods/embeddium-${embeddium_version}.jar"),
                file("run/mods-disabled-no-sodium/embeddium-${embeddium_version}.jar"),
        ]
        def source = candidates.find { it.exists() }
        if (source == null) {
            throw new GradleException(
                    "Embeddium JAR not found. Expected one of: ${candidates*.absolutePath.join(', ')}. " +
                            "Place embeddium-${embeddium_version}.jar there, or pre-populate libs/ manually.")
        }
        embeddium_compile_jar.parentFile.mkdirs()
        embeddium_compile_jar.bytes = source.bytes
    }
}

tasks.register('extendedYRangeTest', JavaExec) {
    group = 'verification'
    description = 'Runs the dependency-free ExtendedYRange contract check.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.world.ExtendedYRangeSelfTest'
}

tasks.register('minecraftCoordinatePackingTest', JavaExec) {
    group = 'verification'
    description = 'Characterizes the Minecraft 1.21.1 BlockPos and SectionPos Y limits.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.world.MinecraftCoordinatePackingSelfTest'
}

tasks.register('verticalRegionTest', JavaExec) {
    group = 'verification'
    description = 'Runs the Vertical Region model contract check.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.world.VerticalRegionSelfTest'
}

tasks.register('renderGridTest', JavaExec) {
    group = 'verification'
    description = 'Checks that vertical render-grid movement recycles one section at a time.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.client.RenderGridSelfTest'
}

tasks.register('sodiumCompatTest', JavaExec) {
    group = 'verification'
    description = 'Checks the Sodium sparse-section lifecycle transition table and vanilla-range boundaries.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.client.SodiumCompatSelfTest'
}

tasks.register('sodiumBytecodeTest', JavaExec) {
    group = 'verification'
    description = 'Verifies the optional Sodium mixin targets against the exact Sodium JAR via ASM.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.client.SodiumBytecodeContractTest'
    systemProperty 'sodium.compile.jar', sodium_compile_jar.absolutePath
}

tasks.register('embeddiumBytecodeTest', JavaExec) {
    group = 'verification'
    description = 'Verifies the optional Embeddium mixin targets against the exact Embeddium JAR via ASM.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'cn.xiaoshuaixia.sparseverticalexpansion.client.EmbeddiumBytecodeContractTest'
    systemProperty 'embeddium.compile.jar', embeddium_compile_jar.absolutePath
}

tasks.named('check') {
    dependsOn 'extendedYRangeTest', 'minecraftCoordinatePackingTest', 'verticalRegionTest', 'renderGridTest', 'sodiumCompatTest', 'sodiumBytecodeTest', 'embeddiumBytecodeTest'
}

tasks.named('test') {
    failOnNoDiscoveredTests = false
}
